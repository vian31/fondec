<head>

<title>Horizon artificiel</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #050507; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 42%, #1b1c22 0%, #050507 72%);
  }
  .instrument {
    position: relative;
    width: 88vmin; height: 88vmin;
    border-radius: 50%;
    overflow: hidden;
    box-shadow: 0 0 2px 2px #000, 0 0 0 8px #161616, 0 0 0 11px #3a3a3a, 0 10px 40px rgba(0,0,0,.7);
  }
  .roll {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    transform: rotate(0deg);
    will-change: transform;
  }
  .layer {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: block;
  }
  .pitch {
    position: absolute; top: 0%; left: 0; width: 100%; height: 100%;
    will-change: top;
  }
  .mechanics { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

  #overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.78); color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; text-align: center; padding: 28px; z-index: 10;
    transition: opacity .4s ease;
  }
  #overlay button {
    font-size: 17px; padding: 14px 30px; border-radius: 30px; border: none;
    background: #ff9f1c; color: #111; font-weight: 600; -webkit-tap-highlight-color: transparent;
  }
  #overlay p { max-width: 300px; font-size: 13px; opacity: .75; line-height: 1.5; margin: 0; }
  #overlay .title { font-size: 16px; font-weight: 600; margin: 0; }
  .hidden { opacity: 0; pointer-events: none; }
</style>
</head>

<div id="overlay">
  <p class="title">Horizon artificiel</p>
  <p>Ce fond réagit à l'inclinaison du téléphone (roulis et tangage), comme un horizon artificiel d'avion.</p>
  <button id="startBtn">Activer les capteurs</button>
  <p id="errMsg" style="color:#ff6b6b;"></p>
</div>

<script>
(function(){
  "use strict";

  var rollEl = document.getElementById('roll');
  var pitchEl = document.getElementById('pitch');
  var overlay = document.getElementById('overlay');
  var startBtn = document.getElementById('startBtn');
  var errMsg = document.getElementById('errMsg');

  var PITCH_BOUND = 30;   // meme limite que la lib d'origine (jquery.flightindicators.js)
  var SMOOTHING = 0.14;   // 0 = pas de lissage, 1 = instantane

  var targetRoll = 0, targetPitch = 0;
  var currentRoll = 0, currentPitch = 0;
  var sensorsActive = false;

  // Reproduit exactement setRoll()/setPitch() de jquery.flightindicators.js
  function setRoll(roll) {
    rollEl.style.transform = 'rotate(' + roll + 'deg)';
  }
  function setPitch(pitch) {
    if (pitch > PITCH_BOUND) pitch = PITCH_BOUND;
    else if (pitch < -PITCH_BOUND) pitch = -PITCH_BOUND;
    pitchEl.style.top = (pitch * 0.7) + '%';
  }

  function getScreenAngle() {
    if (screen.orientation && typeof screen.orientation.angle === 'number') return screen.orientation.angle;
    if (typeof window.orientation === 'number') return window.orientation;
    return 0;
  }

  function handleOrientation(e) {
    if (e.beta === null || e.gamma === null) return;
    var angle = getScreenAngle();
    var roll, pitch;
    if (angle === 90) {
      roll = -e.beta;
      pitch = e.gamma;
    } else if (angle === -90 || angle === 270) {
      roll = e.beta;
      pitch = -e.gamma;
    } else {
      // Portrait : telephone tenu vertical devant soi -> beta proche de 90 = vol en palier
      roll = e.gamma;
      pitch = e.beta - 90;
    }
    targetRoll = roll;
    targetPitch = pitch;
    sensorsActive = true;
  }

  function animate() {
    currentRoll += (targetRoll - currentRoll) * SMOOTHING;
    currentPitch += (targetPitch - currentPitch) * SMOOTHING;
    setRoll(currentRoll);
    setPitch(currentPitch);
    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);

  function hideOverlay() {
    overlay.classList.add('hidden');
    setTimeout(function(){ overlay.style.display = 'none'; }, 400);
  }

  function startSensors() {
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      // iOS 13+: necessite un geste utilisateur
      DeviceOrientationEvent.requestPermission().then(function(state){
        if (state === 'granted') {
          window.addEventListener('deviceorientation', handleOrientation);
          hideOverlay();
        } else {
          errMsg.textContent = "Acces aux capteurs refuse dans les reglages du navigateur.";
        }
      }).catch(function(err){
        errMsg.textContent = "Erreur capteurs : " + err.message;
      });
    } else if ('DeviceOrientationEvent' in window) {
      window.addEventListener('deviceorientation', handleOrientation);
      hideOverlay();
    } else {
      errMsg.textContent = "Ce navigateur ne supporte pas les capteurs d'orientation.";
    }
  }

  startBtn.addEventListener('click', startSensors);

  // Demarrage automatique si aucune permission explicite n'est requise (Android)
  if (!(typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function')) {
    window.addEventListener('deviceorientation', handleOrientation);
    setTimeout(function(){ if (sensorsActive) hideOverlay(); }, 600);
  }

  // Secours pour previsualisation sur ordinateur (souris) tant que les capteurs n'ont rien envoye
  window.addEventListener('mousemove', function(e){
    if (sensorsActive) return;
    var nx = (e.clientX / window.innerWidth - 0.5) * 2;
    var ny = (e.clientY / window.innerHeight - 0.5) * 2;
    targetRoll = nx * 45;
    targetPitch = ny * 25;
  });
})();
</script>
