<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1b2a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Skull King">
<meta name="description" content="Compteur de points pour Skull King : annonces, plis, bonus et classement en direct.">
<title>Skull King · Compteur</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face{font-family:'Luckiest Guy';src:url(fonts/luckiest-guy.woff2) format('woff2');font-display:swap}
@font-face{font-family:Nunito;src:url(fonts/nunito.woff2) format('woff2');font-weight:200 1000;font-display:swap}
:root{
  --ink:#0d1b2a; --sea:#12324a; --deep:#081320;
  --gold:#ffc83d; --gold-d:#c48a00;
  --red:#ff3b4e; --red-d:#a3122a;
  --teal:#20d6c7; --teal-d:#0b8c82;
  --violet:#9b5cff; --violet-d:#5a2bb0;
  --paper:#f6e7c1;
  --key:#24496a; --key-d:#0c2236;
  --txt:#fdf6e3; --mut:#b0c4d6;
  --arcade:'Luckiest Guy',Impact,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:max(16px,min(calc(100vw / 38),calc(100dvh / 52)))}
html,body{height:100%}
body{background:var(--deep);color:var(--txt);font-family:Nunito,system-ui,sans-serif;font-weight:800;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer;touch-action:manipulation}
input{font:inherit}
#app{max-width:48rem;margin:0 auto;height:100dvh;display:flex;flex-direction:column;
  background:radial-gradient(120% 60% at 50% 0,#1d4466 0,var(--sea) 30%,var(--ink) 65%,var(--deep));
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
header{display:flex;align-items:center;gap:0.375rem;padding:0.625rem 0.75rem 0.375rem}
.logo{flex:1;min-width:0;font-family:var(--arcade);font-size:1.5625rem;color:var(--gold);text-shadow:0 0.125rem 0 var(--red-d),0 0.25rem 0.625rem #000;letter-spacing:.5px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-top:0.1875rem}
.ico{width:2.5rem;height:2.5rem;border-radius:0.75rem;background:#ffffff14;display:grid;place-items:center;font-size:1.1875rem;flex:none;box-shadow:0 0.1875rem 0 #0005}
.ico:active{transform:translateY(0.125rem);box-shadow:0 0.0625rem 0 #0005}
.ico:disabled{opacity:.25}
.ico.ghost{visibility:hidden}
main{flex:1;overflow-y:auto;padding:0.25rem 0.875rem 0.75rem;display:flex;flex-direction:column;gap:0.625rem;-webkit-overflow-scrolling:touch}
footer{padding:0.625rem 0.875rem calc(0.875rem + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:0.5rem}
.ttl{font-family:var(--arcade);font-size:1.875rem;text-align:center;text-shadow:0 0.1875rem 0 #000;letter-spacing:.5px;line-height:1.1}
.ttl small{display:block;font-family:Nunito,sans-serif;font-weight:900;font-size:1.125rem;color:var(--teal);letter-spacing:0.125rem;text-shadow:none;margin-bottom:0.5rem}
.hint{text-align:center;color:var(--mut);font-size:1rem;line-height:1.4}
.hint b{color:var(--txt)}

/* Boutons arcade */
.btn{font-family:var(--arcade);border-radius:1.125rem;padding:1rem 0.875rem 0.75rem;font-size:1.375rem;letter-spacing:0.0625rem;text-align:center;width:100%;
  color:#2a1600;background:var(--gold);box-shadow:0 0.375rem 0 var(--gold-d),0 0.625rem 1.125rem #0008;transition:transform .06s,box-shadow .06s,filter .2s}
.btn:active{transform:translateY(0.3125rem);box-shadow:0 0.0625rem 0 var(--gold-d),0 0.1875rem 0.5rem #0008}
.btn.red{background:var(--red);color:#fff;box-shadow:0 0.375rem 0 var(--red-d),0 0.625rem 1.125rem #0008}
.btn.red:active{box-shadow:0 0.0625rem 0 var(--red-d)}
.btn.teal{background:var(--teal);color:#012;box-shadow:0 0.375rem 0 var(--teal-d),0 0.625rem 1.125rem #0008}
.btn.teal:active{box-shadow:0 0.0625rem 0 var(--teal-d)}
.btn.dim{background:#ffffff1a;color:var(--txt);box-shadow:0 0.3125rem 0 #0007}
.btn.dim:active{box-shadow:0 0.0625rem 0 #0007}
.btn.sm{font-size:1.0625rem;padding:0.75rem 0.625rem 0.5625rem;border-radius:0.875rem}
.btn:disabled{filter:grayscale(1) brightness(.55);transform:none;box-shadow:0 0.375rem 0 #0006}

/* Avatars */
.av{width:2.375rem;height:2.375rem;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:1.25rem;box-shadow:0 0.1875rem 0 #0006,inset 0 -0.1875rem 0 #0003;flex:none}
.av.lg{width:4rem;height:4rem;font-size:2.125rem;box-shadow:0 0.3125rem 0 #0006,inset 0 -0.25rem 0 #0003,0 0 1.5rem var(--c)}
.av.xs{width:1.5rem;height:1.5rem;font-size:0.875rem;box-shadow:none}

/* Équipage */
.pl{display:flex;align-items:center;gap:0.625rem;background:#ffffff0e;border-radius:1rem;padding:0.5rem 0.5rem 0.5rem 0.625rem;border-left:0.375rem solid var(--c)}
.pl .nm{flex:1;font-weight:900;font-size:1.125rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-ico{width:2.25rem;height:2.25rem;border-radius:0.625rem;background:#ffffff10;font-size:0.9375rem;color:var(--mut)}
.mini-ico:active{background:#ffffff30}
.add{display:flex;gap:0.5rem}
.add input{flex:1;min-width:0;background:var(--paper);color:#4a3415;border:none;border-radius:1rem;padding:0.875rem;font-weight:900;font-size:1.125rem;box-shadow:inset 0 0.1875rem 0 #0002;outline:none;-webkit-user-select:text;user-select:text}
.add input::placeholder{color:#a08a5c}
.add .btn{width:4rem;font-size:1.875rem;padding:0.625rem 0 0.375rem}
.recent{display:flex;flex-wrap:wrap;gap:0.375rem;justify-content:center}
.recent button{background:#ffffff12;border-radius:1.25rem;padding:0.4375rem 0.8125rem;font-weight:900;font-size:0.875rem;box-shadow:0 0.1875rem 0 #0005}
.recent button:active{transform:translateY(0.125rem);box-shadow:none}
.opts-sum{display:flex;gap:0.375rem;justify-content:center;flex-wrap:wrap}
.tag{font-size:0.8125rem;font-weight:900;border-radius:0.625rem;padding:0.25rem 0.5625rem;background:#ffffff12;color:var(--mut)}
.tag.on{background:#ffc83d26;color:var(--gold)}

/* Progression des manches */
.dots{display:flex;gap:0.375rem;justify-content:center;flex-wrap:wrap}
.dots i,.dots button{width:1.875rem;height:1.875rem;border-radius:0.625rem;background:#ffffff12;font-style:normal;font-family:Nunito,sans-serif;font-size:0.9375rem;font-weight:900;display:grid;place-items:center;color:var(--mut);transition:transform .05s}
.dots button.d{cursor:pointer;box-shadow:0 0.125rem 0 #0b2a20}
.dots button.d:active{transform:translateY(0.0625rem) scale(.94);box-shadow:none}
.dots i.d,.dots button.d{background:var(--teal-d);color:#fff}
.dots i.c,.dots button.c{background:var(--gold);color:#000;transform:scale(1.18);box-shadow:0 0 0.75rem var(--gold)}
.dots button.c:active{transform:translateY(0.0625rem) scale(1.1);box-shadow:none}

/* Annonces */
.who{display:flex;align-items:center;gap:0.75rem;justify-content:center;margin-top:0.25rem}
.who .nm{font-family:var(--arcade);font-size:1.75rem;padding-top:0.25rem;max-width:60vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:0.625rem}
.k{font-family:var(--arcade);font-size:2.25rem;border-radius:1rem;padding:0.25rem 0 0;aspect-ratio:1.5;display:grid;place-items:center;text-align:center;background:var(--key);box-shadow:0 0.3125rem 0 var(--key-d);transition:transform .05s}
.k:active{transform:translateY(0.25rem);box-shadow:0 0.0625rem 0 var(--key-d)}
.k.on{background:var(--gold);color:#000;box-shadow:0 0.3125rem 0 var(--gold-d),0 0 1rem #ffc83d88}
.k.zero{background:var(--violet);box-shadow:0 0.3125rem 0 var(--violet-d)}
.k.zero.on{background:var(--gold);box-shadow:0 0.3125rem 0 var(--gold-d),0 0 1rem #ffc83d88}
.chips{display:flex;flex-wrap:wrap;gap:0.5rem;justify-content:center}
.chip{display:flex;align-items:center;gap:0.375rem;background:#ffffff12;border-radius:1.375rem;padding:0.25rem 0.75rem 0.25rem 0.25rem;font-weight:900;font-size:0.9375rem;box-shadow:0 0.1875rem 0 #0005}
.chip b{color:var(--gold);font-family:var(--arcade);font-size:1.125rem;padding-top:0.125rem;min-width:0.75rem;text-align:center}
.chip b.q{color:var(--mut)}
.chip.cur{outline:0.1875rem solid var(--gold);background:#ffc83d22}
.chip.boom{background:var(--red);color:#fff}
.chip.boom b{color:#fff}
.sum{text-align:center;font-weight:900;font-size:0.9375rem;color:var(--mut)}
.sum b{font-family:var(--arcade);font-size:1.25rem}
.allset{text-align:center;font-family:var(--arcade);font-size:1.5rem;color:var(--teal);padding:1rem 0 0.25rem}
.box{background:#ffffff0a;border:0.0625rem dashed #ffffff22;border-radius:1rem;padding:0.625rem;display:flex;flex-direction:column;gap:0.5rem}
.box h3{font-family:var(--arcade);font-weight:400;font-size:1.0625rem;text-align:center;color:var(--red);letter-spacing:.5px}

/* Résultats */
.row{background:#ffffff0e;border-radius:1rem;padding:0.5625rem 0.625rem;border-left:0.375rem solid var(--c);display:flex;flex-direction:column;gap:0.5rem}
.rh{display:flex;align-items:center;gap:0.625rem}
.rh .nm{flex:1;font-weight:900;font-size:1.0625rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pts{font-family:var(--arcade);font-size:1.5rem;min-width:3.5rem;text-align:right;padding-top:0.1875rem}
.pos{color:var(--teal)} .neg{color:var(--red)} .nil{color:var(--mut)}
.row.won{background:linear-gradient(90deg,#20d6c724,#ffffff0b)}
.row.lost{background:linear-gradient(90deg,#ff3b4e24,#ffffff0b)}
.bonusbtn{flex:none;width:2.25rem;height:2.25rem;border-radius:0.75rem;background:#3c3012;color:var(--gold);box-shadow:0 0.25rem 0 #1d1707;font-size:1.125rem;display:grid;place-items:center}
.bonusbtn.has{background:var(--gold);color:#000;box-shadow:0 0.25rem 0 var(--gold-d)}
.bonusbtn:active{transform:translateY(0.1875rem);box-shadow:none}
.tkrow{display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap}
.bidlbl{flex:none;display:flex;flex-direction:column;align-items:center;gap:0.0625rem;background:#ffffff10;border-radius:0.75rem;padding:0.3125rem 0.625rem;font-size:0.75rem;color:var(--mut);font-weight:900;line-height:1}
.bidlbl b{font-family:var(--arcade);color:var(--txt);font-size:1.375rem;font-weight:400;padding-top:0.125rem}
.tk{display:flex;flex-wrap:wrap;gap:0.375rem;flex:1}
.tk button{position:relative;font-family:var(--arcade);font-size:1.1875rem;width:2.625rem;height:2.625rem;padding:0;border-radius:0.6875rem;background:var(--key);box-shadow:0 0.25rem 0 var(--key-d);display:grid;place-items:center}
.tk button.tgt::after{content:'';position:absolute;bottom:0.3125rem;width:0.375rem;height:0.375rem;border-radius:50%;background:var(--gold)}
.tk button.on-ok{background:var(--teal);color:#012;box-shadow:0 0.25rem 0 var(--teal-d),0 0 0.875rem #20d6c766}
.tk button.on-ko{background:var(--red);color:#fff;box-shadow:0 0.25rem 0 var(--red-d),0 0 0.875rem #ff3b4e66}
.tk button.on-ok.tgt::after,.tk button.on-ko.tgt::after{background:#00000055}
.tk button:active{transform:translateY(0.1875rem);box-shadow:none}
.btags{display:flex;gap:0.3125rem;flex-wrap:wrap}
.btags span{font-size:0.8125rem;font-weight:900;background:#ffc83d22;color:var(--gold);border-radius:0.5rem;padding:0.1875rem 0.4375rem}
.btags span.off{background:#ffffff10;color:var(--mut);text-decoration:line-through}
.warn{text-align:center;font-size:0.875rem;color:var(--gold);font-weight:900}
.warn.bad{color:var(--red)}

/* Classement */
.rank{display:flex;align-items:center;gap:0.625rem;padding:0.5rem 0.625rem;border-radius:0.875rem;background:#ffffff0b;position:relative}
.rank.first{background:linear-gradient(90deg,#ffc83d38,#ffffff08)}
.rk{font-family:var(--arcade);width:1.5rem;font-size:1.375rem;color:var(--mut);text-align:center;padding-top:0.1875rem}
.rank.first .rk{color:var(--gold)}
.bar{flex:1;min-width:0}
.bar .nm{font-weight:900;font-size:1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr{height:0.5625rem;border-radius:0.3125rem;background:#ffffff12;margin-top:0.25rem;overflow:hidden}
.tr i{display:block;height:100%;background:var(--c);border-radius:0.3125rem;transition:width .7s cubic-bezier(.2,.9,.3,1.2)}
.tot{font-family:var(--arcade);font-size:1.625rem;text-align:right;padding-top:0.1875rem;line-height:1}
.delta{font-size:0.8125rem;font-weight:900;text-align:right}
.tbl{overflow-x:auto;border-radius:0.875rem;background:#ffffff08}
table{width:100%;border-collapse:collapse;font-size:0.875rem;font-weight:900}
th{color:var(--mut);font-weight:900;padding:0.375rem 0.125rem;font-size:1rem}
th span{display:block;height:0.1875rem;border-radius:0.125rem;background:var(--c);margin:0.1875rem 0.375rem 0}
td{text-align:center;padding:0.375rem 0.125rem;border-top:0.0625rem solid #ffffff10}
td:first-child{color:var(--mut);width:1.75rem}
td .s{display:block;font-size:0.75rem;color:var(--mut)}
tr.edit:active td{background:#ffffff14}
tr.sumrow td{font-family:var(--arcade);font-size:1rem;font-weight:400;color:var(--gold);border-top:0.125rem solid #ffffff30;padding-top:0.5rem}
.n{color:var(--red)}

/* Fin */
.crown{font-size:4rem;text-align:center;filter:drop-shadow(0 0 1.125rem var(--gold));animation:float 2.4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-0.5rem) rotate(-4deg)}}
.winner{font-family:var(--arcade);font-size:2.5rem;text-align:center;color:var(--gold);text-shadow:0 0.25rem 0 var(--red-d),0 0.5rem 1.25rem #000}
.pod{display:flex;align-items:flex-end;justify-content:center;gap:0.5rem;margin-top:0.375rem}
.pod div{width:5.75rem;border-radius:0.875rem 0.875rem 0 0;text-align:center;font-family:var(--arcade);padding-top:0.625rem;box-shadow:inset 0 -0.5rem 0 #0004;background:var(--c);color:#111;font-size:0.9375rem;line-height:1.35;overflow:hidden}
.pod div .e{font-size:1.75rem}
.pod div .p{font-size:1.375rem}

/* Modales */
.veil{position:fixed;inset:0;background:#000b;display:flex;align-items:flex-end;justify-content:center;z-index:10;animation:fade .15s}
.sheet{width:100%;max-width:48rem;max-height:92dvh;overflow-y:auto;background:linear-gradient(180deg,#183a57,var(--ink));border-radius:1.5rem 1.5rem 0 0;padding:0.875rem 0.875rem calc(1rem + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:0.625rem;box-shadow:0 -0.625rem 1.875rem #000;animation:up .2s cubic-bezier(.2,.9,.3,1.1)}
.sheet.full{height:92dvh}
.sh{display:flex;align-items:center;gap:0.5rem}
.sh .logo{text-align:left}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40%);opacity:.4}}
.brow{display:flex;align-items:center;gap:0.625rem;background:#ffffff0e;border-radius:0.875rem;padding:0.5rem 0.625rem}
.brow .e{font-size:1.625rem;width:2.125rem;text-align:center}
.brow .l{flex:1;font-weight:900;font-size:0.9375rem;line-height:1.2}
.brow .l small{display:block;color:var(--mut);font-size:0.8125rem}
.stp{display:flex;align-items:center;gap:0.375rem}
.stp button{width:2.75rem;height:2.75rem;border-radius:0.75rem;background:var(--key);box-shadow:0 0.25rem 0 var(--key-d);font-family:var(--arcade);font-size:1.5rem;padding-top:0.25rem}
.stp button:active{transform:translateY(0.1875rem);box-shadow:none}
.stp button.on{background:var(--gold);color:#000;box-shadow:0 0.25rem 0 var(--gold-d)}
.stp output{font-family:var(--arcade);font-size:1.375rem;min-width:1.375rem;text-align:center;padding-top:0.1875rem}
.sw{display:flex;align-items:center;gap:0.75rem;background:#ffffff0e;border-radius:0.875rem;padding:0.75rem;text-align:left;width:100%}
.sw .l{flex:1;font-weight:900;font-size:1rem;line-height:1.25}
.sw .l small{display:block;color:var(--mut);font-size:0.8125rem;font-weight:800}
.tog{width:3.5rem;height:2rem;border-radius:1rem;background:#ffffff22;position:relative;flex:none;transition:background .2s}
.tog::after{content:'';position:absolute;top:0.1875rem;left:0.1875rem;width:1.625rem;height:1.625rem;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 0.125rem 0.25rem #0006}
.sw.on .tog{background:var(--teal)}
.sw.on .tog::after{left:1.6875rem}
.rule h3{font-family:var(--arcade);font-weight:400;font-size:1.1875rem;color:var(--gold);letter-spacing:.5px;margin:0.375rem 0 0.25rem}
.rule p,.rule li{font-size:0.875rem;line-height:1.5;font-weight:700;color:#d6e2ec}
.rule b{color:var(--txt)}
.rule ul{list-style:none;display:flex;flex-direction:column;gap:0.375rem}
.rule li{background:#ffffff0b;border-radius:0.75rem;padding:0.5rem 0.625rem;display:flex;gap:0.625rem;align-items:flex-start}
.rule li>span:first-child{font-size:1.375rem;line-height:1.1;flex:none;width:1.75rem;text-align:center}
.rule .order{font-family:var(--arcade);font-size:1rem;text-align:center;color:var(--txt);background:#ffc83d18;border-radius:0.75rem;padding:0.625rem 0.375rem 0.4375rem;line-height:1.5}
.rule .on-opt{color:var(--teal);font-size:0.8125rem;font-family:Nunito,sans-serif;font-weight:900;letter-spacing:0.0625rem}
.rules{font-size:0.875rem;color:var(--mut);line-height:1.5;background:#ffffff08;border-radius:0.875rem;padding:0.625rem 0.75rem;font-weight:700}
.rules b{color:var(--txt)}

/* Effets */
.pop{animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.6)}}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-0.4375rem)}40%{transform:translateX(0.375rem)}60%{transform:translateX(-0.25rem)}80%{transform:translateX(0.125rem)}}
.coin{position:fixed;pointer-events:none;font-size:1.375rem;z-index:50}
.empty{text-align:center;color:var(--mut);padding:1.875rem 0.625rem;font-size:0.9375rem;line-height:1.6}
.empty .big{font-size:3.5rem;display:block;filter:drop-shadow(0 0 0.875rem #ffc83d55)}

/* Écran de démarrage : reste figé tant que la page n'est pas vraiment prête (classe .go
   ajoutée par le script une fois les polices et ressources chargées), pour ne jamais se
   jouer caché derrière l'écran de lancement natif de l'appli installée. */
#boot{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0.75rem;
  background:radial-gradient(120% 60% at 50% 0,#1d4466 0,var(--sea) 30%,var(--ink) 65%,var(--deep));
  transition:opacity .4s ease,transform .4s ease}
#boot.out{opacity:0;transform:scale(1.06)}
.bootfx{position:absolute;inset:0;overflow:hidden}
.bootfx span{position:absolute;bottom:-2rem;font-size:1.25rem;opacity:0}
#boot.go .bootfx span{animation:bootfloat 2.4s ease-in forwards}
.bootlogo{width:6.5rem;height:6.5rem;border-radius:1.5rem;display:block;box-shadow:0 0.75rem 2rem #000a,0 0 2.5rem #ffc83d55;
  opacity:0;transform:scale(.3) rotate(-18deg)}
#boot.go .bootlogo{animation:bootpop .7s cubic-bezier(.17,.89,.32,1.49) both}
.boottitle{font-family:var(--arcade);font-size:2.125rem;color:var(--gold);text-shadow:0 0.2rem 0 var(--red-d),0 0.4rem 1rem #000;
  letter-spacing:.0625rem;opacity:0;transform:translateY(.6rem)}
#boot.go .boottitle{animation:bootup .5s ease .35s both}
.boottag{font-weight:900;font-size:0.9375rem;letter-spacing:.2rem;color:var(--teal);text-transform:uppercase;
  opacity:0;transform:translateY(.6rem)}
#boot.go .boottag{animation:bootup .5s ease .6s both}
@keyframes bootpop{0%{transform:scale(.3) rotate(-18deg);opacity:0}60%{transform:scale(1.08) rotate(4deg);opacity:1}100%{transform:scale(1) rotate(0)}}
@keyframes bootup{from{opacity:0;transform:translateY(.6rem)}to{opacity:1;transform:none}}
@keyframes bootfloat{0%{opacity:0;transform:translateY(0) rotate(0)}15%{opacity:.85}100%{opacity:0;transform:translateY(-32rem) rotate(50deg)}}
@media (prefers-reduced-motion: reduce){.bootlogo,.boottitle,.boottag{animation:none;opacity:1;transform:none}.bootfx{display:none}}
</style>
</head>
<body>
<div id="boot" aria-hidden="true">
  <div class="bootfx"></div>
  <svg class="bootlogo" viewBox="0 0 512 512" aria-hidden="true">
    <defs><radialGradient id="bootg" cx="50%" cy="30%" r="75%"><stop offset="0" stop-color="#1d4466"/><stop offset=".6" stop-color="#0d1b2a"/><stop offset="1" stop-color="#081320"/></radialGradient></defs>
    <rect width="512" height="512" rx="112" fill="url(#bootg)"/>
    <g stroke="#a3122a" stroke-width="40" stroke-linecap="round"><line x1="110" y1="360" x2="402" y2="440"/><line x1="402" y1="360" x2="110" y2="440"/></g>
    <g stroke="#ff3b4e" stroke-width="30" stroke-linecap="round"><line x1="110" y1="352" x2="402" y2="432"/><line x1="402" y1="352" x2="110" y2="432"/></g>
    <path d="M256 92c-88 0-150 58-150 140 0 46 20 80 52 102v42c0 14 11 24 24 24h148c13 0 24-10 24-24v-42c32-22 52-56 52-102 0-82-62-140-150-140z" fill="#c48a00"/>
    <path d="M256 84c-88 0-150 58-150 140 0 46 20 80 52 102v42c0 14 11 24 24 24h148c13 0 24-10 24-24v-42c32-22 52-56 52-102 0-82-62-140-150-140z" fill="#ffc83d"/>
    <ellipse cx="200" cy="236" rx="40" ry="44" fill="#0d1b2a"/><ellipse cx="312" cy="236" rx="40" ry="44" fill="#0d1b2a"/>
    <path d="M256 284l-24 40h48z" fill="#0d1b2a"/>
    <g fill="#0d1b2a"><rect x="206" y="356" width="16" height="36" rx="6"/><rect x="248" y="356" width="16" height="36" rx="6"/><rect x="290" y="356" width="16" height="36" rx="6"/></g>
  </svg>
  <div class="boottitle">☠ SKULL KING</div>
  <div class="boottag">Compteur de points</div>
</div>
<div id="app"></div>
<div id="modal"></div>
<script>
'use strict';
var ROUNDS = 10;
var KEY = 'skullking-v1', RECENT = 'skullking-recent';
var COLORS = ['#ff3b4e', '#20d6c7', '#ffc83d', '#9b5cff', '#ff8a1f', '#4da3ff', '#ff5fb8', '#7ee05a'];
var EMOJIS = ['🦜', '🐙', '💀', '🧜', '🦈', '⚓', '🦑', '🐢', '🦀', '🐳', '🗡️', '🏴‍☠️', '🍺', '🦴', '🧭', '💎'];
var BONUS = [
  { k: 'c14', e: '🃏', l: '14 de couleur', s: '+10 chacun', p: 10, max: 3 },
  { k: 'b14', e: '🏴‍☠️', l: '14 noir', s: '+20', p: 20, max: 1 },
  { k: 'mer', e: '🧜', l: 'Sirène capturée', s: 'par un pirate · +20 chacune', p: 20, max: 2 },
  { k: 'pir', e: '🗡️', l: 'Pirate capturé', s: 'par le Skull King · +30 chacun', p: 30, max: 6 },
  { k: 'sk', e: '👑', l: 'Skull King capturé', s: 'par une sirène · +40', p: 40, max: 1 },
  { k: 'loot', e: '💰', l: 'Butin', s: '+20 si toi et ton allié réussissez', p: 20, max: 2 }
];

var S = load() || fresh();
var undoStack = [];
var ui = { sel: null, modal: null, anim: null, recent: loadRecent() };

function fresh() {
  return { players: [], opts: { bonus: true, rascal: false }, rounds: [], done: 0, view: 'setup', edit: null };
}
function load() {
  try { var s = JSON.parse(localStorage.getItem(KEY)); return s && s.players ? s : null; } catch (e) { return null; }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
}
function loadRecent() {
  try { return JSON.parse(localStorage.getItem(RECENT)) || []; } catch (e) { return []; }
}
function saveRecent() {
  var names = S.players.map(function (p) { return p.name; });
  ui.recent = names.concat(ui.recent.filter(function (n) { return names.indexOf(n) < 0; })).slice(0, 16);
  try { localStorage.setItem(RECENT, JSON.stringify(ui.recent)); } catch (e) {}
}

// Toute modification passe par commit() : instantané pour annuler, sauvegarde, rendu.
function commit(fn) {
  undoStack.push(JSON.stringify(S));
  if (undoStack.length > 80) undoStack.shift();
  fn();
  save();
  render();
}
function undo() {
  if (!undoStack.length) return;
  S = JSON.parse(undoStack.pop());
  ui.sel = null; ui.modal = null;
  save(); render(); buzz(20);
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; });
}
function buzz(ms) { try { navigator.vibrate && navigator.vibrate(ms || 8); } catch (e) {} }
function player(id) { return S.players.find(function (p) { return p.id === id; }); }
function av(p, cls) { return '<span class="av ' + (cls || '') + '" style="--c:' + p.color + '">' + p.emoji + '</span>'; }
function fmt(v) { return v > 0 ? '+' + v : v < 0 ? '−' + Math.abs(v) : '0'; }
function num(v) { return v < 0 ? '−' + Math.abs(v) : String(v); }
function cls(v) { return v > 0 ? 'pos' : v < 0 ? 'neg' : 'nil'; }

/* ---------- Calcul des points ---------- */
function R(i) {
  return S.rounds[i] || (S.rounds[i] = { bids: {}, tricks: {}, bonus: {}, cannon: {} });
}
function bonusSum(b) {
  if (!b) return 0;
  return BONUS.reduce(function (t, x) { return t + (b[x.k] || 0) * x.p; }, 0);
}
function roundScore(i, pid) {
  var r = S.rounds[i], n = i + 1;
  if (!r) return null;
  var bid = r.bids[pid], t = r.tricks[pid];
  if (bid == null || t == null) return null;
  var b = S.opts.bonus ? bonusSum(r.bonus[pid]) : 0;
  var diff = Math.abs(bid - t);
  if (S.opts.rascal) {
    // Comptage de Rascal : potentiel de 10 pts par carte, moitié si écart de 1, rien au-delà.
    if (r.cannon[pid]) return diff === 0 ? 15 * n + b : 0;
    if (diff === 0) return 10 * n + b;
    if (diff === 1) return (10 * n + b) / 2;
    return 0;
  }
  if (bid === 0) return diff === 0 ? 10 * n + b : -10 * n;
  return diff === 0 ? 20 * bid + b : -10 * diff;
}
function totals(upto) {
  var t = {};
  S.players.forEach(function (p) {
    t[p.id] = 0;
    for (var i = 0; i < upto; i++) t[p.id] += roundScore(i, p.id) || 0;
  });
  return t;
}
function ranking(upto) {
  var t = totals(upto);
  var arr = S.players.map(function (p) { return { p: p, tot: t[p.id] }; });
  arr.sort(function (a, b) { return b.tot - a.tot; });
  arr.forEach(function (x, i) { x.rank = i && x.tot === arr[i - 1].tot ? arr[i - 1].rank : i + 1; });
  return arr;
}
function curRound() { return S.edit ? S.edit.round : S.done; }

/* ---------- Rendu ---------- */
function header(title, left, right) {
  return '<header>' + (left || '<span class="ico ghost"></span>') + '<div class="logo">' + title + '</div>' + (right || '<span class="ico ghost"></span>') + '</header>';
}
function undoBtn() { return '<button class="ico" data-act="undo" aria-label="Annuler"' + (undoStack.length ? '' : ' disabled') + '>↶</button>'; }
function rulesBtn() { return '<button class="ico" data-act="rules" aria-label="Règle du jeu">📜</button>'; }
function gameLeft() { return undoBtn() + rulesBtn(); }
function gameRight() { return '<button class="ico" data-act="board" aria-label="Scores">🏆</button><button class="ico" data-act="settings" aria-label="Réglages">⚙</button>'; }
function dots(cur) {
  var h = '<div class="dots">';
  for (var i = 0; i < ROUNDS; i++) {
    var gold = i === cur, clickable = i < S.done, cls = (clickable ? 'd' : '') + (gold ? ' c' : '');
    h += clickable
      ? '<button class="' + cls.trim() + '" data-act="editround" data-v="' + i + '" aria-label="Corriger la manche ' + (i + 1) + '">' + (i + 1) + '</button>'
      : '<i class="' + cls.trim() + '">' + (i + 1) + '</i>';
  }
  return h + '</div>';
}

function vSetup() {
  var can = S.players.length >= 2;
  return header('☠ SKULL KING', rulesBtn(), '<button class="ico" data-act="settings" aria-label="Réglages">⚙</button>') +
    '<main><div class="ttl"><small>QUI EMBARQUE ?</small>Équipage</div>' +
    '<div id="plist" style="display:flex;flex-direction:column;gap:0.5rem">' + setupList() + '</div>' +
    '<form class="add" data-form="add"' + (S.players.length >= 8 ? ' hidden' : '') + '><input id="pname" enterkeyhint="done" autocomplete="off" maxlength="14" placeholder="Nom du pirate…"><button class="btn" type="submit" aria-label="Ajouter">+</button></form>' +
    '<div id="recent">' + recentHtml() + '</div>' +
    '<div class="opts-sum"><span class="tag ' + (S.opts.bonus ? 'on' : '') + '">⭐ Bonus ' + (S.opts.bonus ? 'activés' : 'désactivés') + '</span><span class="tag ' + (S.opts.rascal ? 'on' : '') + '">🎯 Comptage ' + (S.opts.rascal ? 'Rascal' : 'classique') + '</span></div>' +
    '</main><footer><button class="btn red" data-act="start"' + (can ? '' : ' disabled') + '>⚓ Lever l\'ancre !</button></footer>';
}
function setupList() {
  if (!S.players.length) return '<div class="empty"><span class="big">🏴‍☠️</span>Ajoute au moins 2 pirates<br>(jusqu\'à 8).</div>';
  return S.players.map(function (p, i) {
    return '<div class="pl" style="--c:' + p.color + '"><button data-act="emoji" data-id="' + p.id + '" aria-label="Changer l\'emoji">' + av(p) + '</button>' +
      '<span class="nm">' + esc(p.name) + '</span>' +
      (i ? '<button class="mini-ico" data-act="up" data-id="' + p.id + '" aria-label="Monter">▲</button>' : '') +
      '<button class="mini-ico" data-act="del" data-id="' + p.id + '" aria-label="Retirer">✕</button></div>';
  }).join('');
}
function recentHtml() {
  var taken = S.players.map(function (p) { return p.name.toLowerCase(); });
  var list = ui.recent.filter(function (n) { return taken.indexOf(n.toLowerCase()) < 0; }).slice(0, 8);
  if (!list.length || S.players.length >= 8) return '';
  return '<div class="hint" style="margin-bottom:0.375rem">Pirates déjà venus à bord :</div><div class="recent">' +
    list.map(function (n) { return '<button data-act="recent" data-name="' + esc(n) + '">+ ' + esc(n) + '</button>'; }).join('') + '</div>';
}

function vBid() {
  var i = curRound(), n = i + 1, r = R(i), ps = S.players;
  if (ui.sel && (!player(ui.sel))) ui.sel = null;
  if (ui.sel == null) {
    var nx = ps.find(function (p) { return r.bids[p.id] == null; });
    ui.sel = nx ? nx.id : null;
  }
  var sel = ui.sel ? player(ui.sel) : null;
  var allIn = ps.every(function (p) { return r.bids[p.id] != null; });
  var sum = ps.reduce(function (t, p) { return t + (r.bids[p.id] || 0); }, 0);
  var h = header('MANCHE ' + n, gameLeft(), gameRight()) + '<main>' + dots(i) +
    '<div class="ttl"><small>' + n + ' CARTE' + (n > 1 ? 'S' : '') + ' · ANNONCES</small></div>';
  if (sel) {
    h += '<div class="who">' + av(sel, 'lg') + '<span class="nm">' + esc(sel.name) + '</span></div><div class="keys">';
    for (var v = 0; v <= n; v++) {
      h += '<button class="k ' + (v === 0 ? 'zero ' : '') + (r.bids[sel.id] === v ? 'on' : '') + '" data-act="bid" data-v="' + v + '">' + v + '</button>';
    }
    h += '</div>';
  } else {
    h += '<div class="allset pop">✔ Tout le monde a parié !</div>';
  }
  h += '<div class="chips">' + ps.map(function (p) {
    var b = r.bids[p.id];
    return '<button class="chip ' + (sel && p.id === sel.id ? 'cur' : '') + '" data-act="selbid" data-id="' + p.id + '">' + av(p, 'xs') + esc(p.name) + ' <b class="' + (b == null ? 'q' : '') + '" data-pop="' + p.id + '">' + (b == null ? '?' : b) + '</b></button>';
  }).join('') + '</div>';
  var sc = sum === n ? 'color:var(--gold)' : sum > n ? 'color:var(--red)' : 'color:var(--teal)';
  h += '<div class="sum">Total annoncé : <b style="' + sc + '">' + sum + '</b> / ' + n + ' pli' + (n > 1 ? 's' : '') +
    (allIn ? (sum > n ? ' · ça va saigner ⚔️' : sum < n ? ' · des plis en trop 🌊' : ' · pile poil 🎯') : '') + '</div>';
  if (allIn && S.opts.rascal) {
    h += '<div class="box"><h3>💣 Boulet de canon ?</h3><div class="hint">Tout ou rien : 15 pts/carte si pari exact, sinon 0.</div><div class="chips">' +
      ps.map(function (p) {
        return '<button class="chip ' + (r.cannon[p.id] ? 'boom' : '') + '" data-act="cannon" data-id="' + p.id + '">' + av(p, 'xs') + esc(p.name) + ' <b>' + (r.cannon[p.id] ? '💣' : '·') + '</b></button>';
      }).join('') + '</div></div>';
  }
  h += sel ? '<div class="hint">Un tap = annonce enregistrée, joueur suivant.<br>Tape un nom pour corriger.</div>' : '';
  return h + '</main><footer><button class="btn teal" data-act="toplay"' + (allIn ? '' : ' disabled') + '>▶ On joue !</button></footer>';
}

function vPlay() {
  var i = curRound(), n = i + 1, r = R(i), ps = S.players;
  var editing = !!S.edit;
  var allSet = ps.every(function (p) { return r.tricks[p.id] != null; });
  var tsum = ps.reduce(function (t, p) { return t + (r.tricks[p.id] || 0); }, 0);
  var h = header(editing ? 'CORRIGER M' + n : 'MANCHE ' + n, gameLeft(), gameRight()) + '<main>' + (editing ? '' : dots(i)) +
    '<div class="ttl"><small>' + n + ' CARTE' + (n > 1 ? 'S' : '') + ' · PLIS REMPORTÉS</small></div>' +
    '<div class="hint">Tape le nombre de plis réellement gagnés par chacun.</div>';
  ps.forEach(function (p) {
    var bid = r.bids[p.id], t = r.tricks[p.id];
    var ok = t != null && t === bid, ko = t != null && !ok;
    var sc = roundScore(i, p.id);
    var bsum = bonusSum(r.bonus[p.id]);
    h += '<div class="row ' + (ok ? 'won' : ko ? 'lost' : '') + '" style="--c:' + p.color + '" data-row="' + p.id + '"><div class="rh">' + av(p) +
      '<span class="nm">' + esc(p.name) + '</span>' +
      (S.opts.rascal && r.cannon[p.id] ? '<span title="Boulet de canon">💣</span>' : '') +
      (S.opts.bonus ? '<button class="bonusbtn ' + (bsum ? 'has' : '') + '" data-act="bonus" data-id="' + p.id + '" aria-label="Bonus">⭐</button>' : '') +
      '<span class="pts ' + (sc == null ? 'nil' : cls(sc)) + '" data-pts="' + p.id + '">' + (sc == null ? '—' : fmt(sc)) + '</span></div>' +
      '<div class="tkrow"><button class="bidlbl" data-act="editbid" data-id="' + p.id + '">Pari<b>' + bid + '</b></button><div class="tk">';
    for (var v = 0; v <= n; v++) {
      var vc = (v === bid ? 'tgt ' : '') + (t === v ? (v === bid ? 'on-ok' : 'on-ko') : '');
      h += '<button class="' + vc + '" data-act="settricks" data-id="' + p.id + '" data-v="' + v + '">' + v + '</button>';
    }
    h += '</div></div>';
    if (S.opts.bonus && bsum) {
      var lost = ko && !(S.opts.rascal && !r.cannon[p.id] && t != null && Math.abs(t - bid) === 1);
      h += '<div class="btags">' + BONUS.filter(function (x) { return (r.bonus[p.id] || {})[x.k]; }).map(function (x) {
        var c = r.bonus[p.id][x.k];
        return '<span class="' + (lost ? 'off' : '') + '">' + x.e + (c > 1 ? '×' + c : '') + ' +' + c * x.p + '</span>';
      }).join('') + '</div>';
    }
    h += '</div>';
  });
  var over = tsum > n;
  if (allSet && tsum !== n) h += '<div class="warn' + (over ? ' bad' : '') + '">⚠ ' + tsum + ' pli' + (tsum > 1 ? 's' : '') + ' saisi' + (tsum > 1 ? 's' : '') + ' pour ' + n + ' carte' + (n > 1 ? 's' : '') + (over ? ' — impossible, vérifie les saisies' : tsum === n - 1 ? ' — le Kraken est passé ?' : '') + '</div>';
  return h + '</main><footer><button class="btn" data-act="validate"' + (allSet && !over ? '' : ' disabled') + '>' + (editing ? '✔ Enregistrer la correction' : '✔ Valider la manche') + '</button></footer>';
}

function board(upto, editable) {
  var rk = ranking(upto), prev = upto ? totals(upto - 1) : {};
  var max = Math.max.apply(null, rk.map(function (x) { return x.tot; }).concat([1]));
  var h = '<div style="display:flex;flex-direction:column;gap:0.375rem">';
  rk.forEach(function (x) {
    var d = upto ? roundScore(upto - 1, x.p.id) || 0 : null;
    h += '<div class="rank ' + (x.rank === 1 && upto ? 'first' : '') + '" data-flip="' + x.p.id + '"><span class="rk">' + x.rank + '</span>' + av(x.p) +
      '<div class="bar"><div class="nm">' + esc(x.p.name) + (x.rank === 1 && upto ? ' 👑' : '') + '</div><div class="tr"><i style="--c:' + x.p.color + ';width:' + Math.max(0, Math.round(x.tot / max * 100)) + '%"></i></div></div>' +
      '<div><div class="tot ' + (x.tot < 0 ? 'neg' : '') + '" data-from="' + (prev[x.p.id] || 0) + '" data-to="' + x.tot + '">' + num(x.tot) + '</div>' +
      (d != null ? '<div class="delta ' + cls(d) + '">' + (d > 0 ? '▲ ' : d < 0 ? '▼ ' : '= ') + fmt(d) + '</div>' : '') + '</div></div>';
  });
  h += '</div>';
  if (!upto) return h + '<div class="hint">Aucune manche terminée pour l\'instant.</div>';
  h += '<div class="tbl"><table><tr><th></th>' + S.players.map(function (p) { return '<th>' + p.emoji + '<span style="--c:' + p.color + '"></span></th>'; }).join('') + '</tr>';
  for (var i = 0; i < upto; i++) {
    var r = S.rounds[i];
    h += '<tr' + (editable ? ' class="edit" data-act="editround" data-v="' + i + '"' : '') + '><td>' + (i + 1) + '</td>' + S.players.map(function (p) {
      var s = roundScore(i, p.id), b = bonusSum(r.bonus[p.id]);
      return '<td class="' + (s < 0 ? 'n' : '') + '">' + num(s || 0) + '<span class="s">' + r.tricks[p.id] + '/' + r.bids[p.id] + (S.opts.bonus && b ? '⭐' : '') + (S.opts.rascal && r.cannon[p.id] ? '💣' : '') + '</span></td>';
    }).join('') + '</tr>';
  }
  var t = totals(upto);
  h += '<tr class="sumrow"><td>Σ</td>' + S.players.map(function (p) { return '<td>' + num(t[p.id]) + '</td>'; }).join('') + '</tr></table></div>';
  return h + (editable
    ? '<div class="hint">Tape une manche pour la corriger. <span style="opacity:.7">(plis/pari)</span></div>'
    : '<div class="hint">Détail par manche <span style="opacity:.7">(plis/pari)</span></div>');
}

function vScores() {
  var d = S.done;
  return header('MANCHE ' + d + ' ✔', gameLeft(), gameRight()) + '<main>' + dots(d - 1) + '<div class="ttl"><small>LE CLASSEMENT</small></div>' + board(d, true) +
    '</main><footer><button class="btn red" data-act="next">▶ Manche ' + (d + 1) + ' · ' + (d + 1) + ' carte' + (d ? 's' : '') + '</button></footer>';
}

function vEnd() {
  var rk = ranking(S.done);
  var win = rk.filter(function (x) { return x.rank === 1; });
  var order = [rk[1], rk[0], rk[2]].filter(Boolean);
  var hts = { 1: 11, 2: 8.75, 3: 7.2 };
  var h = header('☠ SKULL KING', gameLeft(), gameRight()) + '<main><div class="ttl" style="margin-top:0.375rem"><small>' + (win.length > 1 ? 'LES ROIS DES PIRATES SONT…' : 'LE ROI DES PIRATES EST…') + '</small></div>' +
    '<div class="crown">👑</div><div class="winner pop">' + win.map(function (x) { return esc(x.p.name); }).join(' & ') + ' !</div><div class="pod">' +
    order.map(function (x) {
      return '<div style="--c:' + x.p.color + ';height:' + hts[Math.min(x.rank, 3)] + 'rem"><span class="e">' + x.p.emoji + '</span><br>' + esc(x.p.name) + '<br><span class="p">' + num(x.tot) + '</span></div>';
    }).join('') + '</div>';
  if (rk.length > 3) {
    h += '<div style="display:flex;flex-direction:column;gap:0.375rem">' + rk.slice(3).map(function (x) {
      return '<div class="rank"><span class="rk">' + x.rank + '</span>' + av(x.p) + '<div class="bar"><div class="nm">' + esc(x.p.name) + '</div></div><div class="tot ' + (x.tot < 0 ? 'neg' : '') + '">' + num(x.tot) + '</div></div>';
    }).join('') + '</div>';
  }
  return h + '</main><footer><button class="btn teal" data-act="rematch">↻ Revanche !</button><button class="btn dim sm" data-act="newcrew">Nouvel équipage</button></footer>';
}

/* ---------- Modales ---------- */
function mBonus(pid) {
  var p = player(pid), i = curRound(), r = R(i), b = r.bonus[pid] || {};
  var bid = r.bids[pid], t = r.tricks[pid];
  var h = '<div class="sh">' + av(p) + '<div class="logo">BONUS · ' + esc(p.name) + '</div><button class="ico" data-act="close">✕</button></div>';
  h += BONUS.map(function (x) {
    var c = b[x.k] || 0;
    var ctl = x.max === 1
      ? '<button class="' + (c ? 'on' : '') + '" data-act="bset" data-id="' + pid + '" data-k="' + x.k + '" data-v="' + (c ? 0 : 1) + '">' + (c ? '✔' : '+') + '</button>'
      : '<button data-act="bset" data-id="' + pid + '" data-k="' + x.k + '" data-v="' + Math.max(0, c - 1) + '">−</button><output>' + c + '</output><button data-act="bset" data-id="' + pid + '" data-k="' + x.k + '" data-v="' + Math.min(x.max, c + 1) + '">+</button>';
    return '<div class="brow"><span class="e">' + x.e + '</span><span class="l">' + x.l + '<small>' + x.s + '</small></span><div class="stp">' + ctl + '</div></div>';
  }).join('');
  var note = S.opts.rascal ? 'Comptage Rascal : bonus entiers si pari exact, moitié si écart de 1.' : 'Comptés uniquement si le pari est réussi.';
  if (t != null && t !== bid && !S.opts.rascal) note = '⚠ Pari raté : ces bonus ne comptent pas.';
  return h + '<div class="hint">' + note + '</div><button class="btn" data-act="close">OK · +' + bonusSum(b) + '</button>';
}
function mPick(pid) {
  var p = player(pid), i = curRound(), n = i + 1, r = R(i);
  var h = '<div class="sh">' + av(p) + '<div class="logo">PARI · ' + esc(p.name) + '</div><button class="ico" data-act="close">✕</button></div><div class="keys">';
  for (var v = 0; v <= n; v++) h += '<button class="k ' + (v === 0 ? 'zero ' : '') + (r.bids[pid] === v ? 'on' : '') + '" data-act="pickbid" data-id="' + pid + '" data-v="' + v + '">' + v + '</button>';
  return h + '</div>';
}
function mBoard() {
  return '<div class="sh"><div class="logo">🏆 SCORES</div><button class="ico" data-act="close">✕</button></div>' + board(S.done, false);
}
function mRules() {
  var li = function (e, t) { return '<li><span>' + e + '</span><span>' + t + '</span></li>'; };
  var scoring = S.opts.rascal
    ? '<ul>' + li('🎯', '<b>Pari exact</b> : 10 pts × nombre de cartes de la manche, + bonus.') +
      li('🌗', '<b>Écart de 1 pli</b> : la moitié (bonus compris).') + li('💨', '<b>Écart de 2 plis ou plus</b> : 0.') +
      li('💣', '<b>Boulet de canon</b> (choisi après les annonces) : 15 pts × cartes + bonus si exact, sinon 0.') +
      li('0️⃣', 'Un pari de 0 se compte comme les autres.') + '</ul>'
    : '<ul>' + li('✔', '<b>Pari réussi</b> (1 ou plus) : 20 pts par pli remporté, + bonus.') +
      li('✘', '<b>Pari raté</b> : −10 pts par pli d\'écart, pas de bonus.') +
      li('0️⃣', '<b>Pari de 0 réussi</b> : 10 pts × nombre de cartes. <b>Raté</b> : −10 pts × nombre de cartes.') + '</ul>';
  var bonus = '<ul>' + BONUS.map(function (x) { return li(x.e, '<b>' + x.l + '</b> ' + x.s); }).join('') + '</ul>' +
    '<p style="margin-top:0.375rem">' + (S.opts.rascal ? 'Comptés en entier si pari exact, à moitié si écart de 1.' : 'Gagnés seulement si le pari est réussi.') + '</p>';
  return '<div class="sh"><div class="logo">📜 LA RÈGLE</div><button class="ico" data-act="close">✕</button></div><div class="rule">' +
    '<h3>Le but</h3><p>10 manches. À la manche <b>N</b>, chacun reçoit <b>N cartes</b>. Il faut annoncer <b>exactement</b> le nombre de plis qu\'on va remporter.</p>' +
    '<h3>Une manche</h3><ul>' +
      li('✊', '<b>Annonce</b> : tous en même temps, poing fermé, « Yo-ho-ho ! » puis on montre le nombre de doigts.') +
      li('🃏', '<b>Jeu</b> : on doit fournir la couleur demandée si possible. Les cartes spéciales se jouent toujours, même si on a la couleur.') +
      li('🏴‍☠️', 'Le <b>noir</b> (Jolly Roger) est l\'atout : il bat les autres couleurs.') +
      li('🔁', 'Le gagnant du pli entame le suivant. Le donneur tourne à chaque manche.') + '</ul>' +
    '<h3>Qui gagne le pli ?</h3><div class="order">👑 Skull King › 🗡️ Pirates › 🧜 Sirènes › 🏴‍☠️ Noir › couleur demandée › 🏳️ Fuite</div><ul style="margin-top:0.375rem">' +
      li('🧜', 'Exception : une <b>sirène capture le Skull King</b> (s\'ils sont tous les trois dans le pli, la sirène gagne).') +
      li('🥇', 'Entre cartes spéciales identiques (2 pirates, 2 sirènes…), <b>la première jouée</b> gagne.') +
      li('🔢', 'Sinon : le plus fort de la couleur demandée, ou le plus fort atout noir.') + '</ul>' +
    '<h3>Cartes spéciales</h3><ul>' +
      li('🏳️', '<b>Fuite</b> : perd toujours. Si toutes les cartes sont des fuites, la première gagne.') +
      li('🐯', '<b>Tigresse</b> : au moment de la jouer, on choisit pirate ou fuite.') +
      li('🦑', '<b>Kraken</b> : le pli est détruit, personne ne le gagne. Celui qui l\'aurait gagné entame.') +
      li('🐳', '<b>Baleine blanche</b> : les cartes spéciales n\'ont plus d\'effet, la plus forte valeur gagne, toutes couleurs confondues.') +
      li('💰', '<b>Butin</b> : se joue comme une fuite ; son joueur s\'allie à celui qui remporte le pli.') + '</ul>' +
    '<h3>Les points <span class="on-opt">' + (S.opts.rascal ? '· COMPTAGE RASCAL' : '· COMPTAGE CLASSIQUE') + '</span></h3>' + scoring +
    (S.opts.bonus ? '<h3>Les bonus</h3>' + bonus : '<p style="margin-top:0.5rem;color:var(--mut)">Points bonus désactivés (⚙ pour les activer).</p>') +
    '</div><button class="btn sm" data-act="close">Compris !</button>';
}
function mSettings() {
  var inGame = S.view !== 'setup';
  return '<div class="sh"><div class="logo">⚙ RÉGLAGES</div><button class="ico" data-act="close">✕</button></div>' +
    '<button class="sw ' + (S.opts.bonus ? 'on' : '') + '" data-act="opt" data-k="bonus"><span class="l">⭐ Points bonus<small>14, sirènes, pirates, Skull King, butin</small></span><span class="tog"></span></button>' +
    '<button class="sw ' + (S.opts.rascal ? 'on' : '') + '" data-act="opt" data-k="rascal"><span class="l">🎯 Comptage de Rascal<small>10 pts/carte si exact, moitié à 1 près, 💣 boulet de canon</small></span><span class="tog"></span></button>' +
    (inGame ? '<div class="hint">Changer une option recalcule toute la partie.</div>' : '') +
    '<div class="rules">' + (S.opts.rascal
      ? '<b>Rascal</b> · pari exact : <b>10 × cartes</b> + bonus · écart de 1 : <b>la moitié</b> · plus : <b>0</b>.<br><b>💣 Boulet</b> · exact : <b>15 × cartes</b> + bonus, sinon <b>0</b>.'
      : '<b>Pari réussi</b> : 20 pts par pli + bonus.<br><b>Pari raté</b> : −10 par pli d\'écart.<br><b>Pari 0</b> : ±10 × nombre de cartes.') + '</div>' +
    (inGame ? '<button class="btn dim sm" data-act="abandon">🏳 Abandonner la partie</button>' : '') +
    '<button class="btn sm" data-act="close">OK</button>';
}

function render() {
  var flip = snapshotFlip();
  var v = S.view;
  var html = v === 'bid' ? vBid() : v === 'play' ? vPlay() : v === 'scores' ? vScores() : v === 'end' ? vEnd() : vSetup();
  var main = document.querySelector('#app main');
  var keep = main && document.getElementById('app').dataset.view === v + (S.edit ? 'e' : '') ? main.scrollTop : 0;
  var app = document.getElementById('app');
  app.innerHTML = html;
  app.dataset.view = v + (S.edit ? 'e' : '');
  var nm = app.querySelector('main');
  if (nm) nm.scrollTop = keep;
  var m = ui.modal, mh = '';
  if (m) {
    var body = m.type === 'bonus' ? mBonus(m.id) : m.type === 'pick' ? mPick(m.id) : m.type === 'board' ? mBoard() : m.type === 'rules' ? mRules() : mSettings();
    mh = '<div class="veil" data-act="veil"><div class="sheet' + (m.type === 'board' || m.type === 'rules' ? ' full' : '') + '">' + body + '</div></div>';
  }
  var md = document.getElementById('modal');
  var sheet = md.querySelector('.sheet'), st = sheet ? sheet.scrollTop : 0;
  var same = md.dataset.type === (m ? m.type + m.id : '');
  md.innerHTML = mh;
  md.dataset.type = m ? m.type + m.id : '';
  if (same && md.querySelector('.sheet')) {
    md.querySelector('.sheet').scrollTop = st;
    md.querySelector('.sheet').style.animation = 'none';
    md.querySelector('.veil').style.animation = 'none';
  }
  if (ui.anim) { playAnim(ui.anim, flip); ui.anim = null; }
}

/* ---------- Effets ---------- */
function snapshotFlip() {
  var pos = {};
  document.querySelectorAll('[data-flip]').forEach(function (el) { pos[el.dataset.flip] = el.getBoundingClientRect().top; });
  return pos;
}
function playAnim(a, flip) {
  if (a === 'scores') {
    // Les lignes partent de l'ancien classement puis glissent à leur place.
    var prev = ranking(S.done - 1).map(function (x) { return x.p.id; });
    var rows = document.querySelectorAll('#app [data-flip]');
    if (rows.length > 1) {
      var hgt = rows[1].getBoundingClientRect().top - rows[0].getBoundingClientRect().top;
      rows.forEach(function (el, idx) {
        var dy = (prev.indexOf(el.dataset.flip) - idx) * hgt;
        if (dy && el.animate) el.animate([{ transform: 'translateY(' + dy + 'px)' }, { transform: 'none' }], { duration: 650, delay: 350, easing: 'cubic-bezier(.3,1.3,.5,1)', fill: 'backwards' });
      });
    }
    document.querySelectorAll('#app .tot[data-to]').forEach(function (el) {
      var from = +el.dataset.from, to = +el.dataset.to, t0 = performance.now();
      (function step(now) {
        var k = Math.min(1, (now - t0) / 700), e = 1 - Math.pow(1 - k, 3);
        el.textContent = num(Math.round(from + (to - from) * e));
        if (k < 1) requestAnimationFrame(step);
      })(t0);
    });
    document.querySelectorAll('#app .tr i').forEach(function (el) {
      var w = el.style.width; el.style.width = '0'; requestAnimationFrame(function () { requestAnimationFrame(function () { el.style.width = w; }); });
    });
  } else if (a === 'end') {
    rain(40);
  } else if (a.type === 'pop') {
    var el = document.querySelector(a.sel);
    if (el) el.classList.add('pop');
  } else if (a.type === 'coins') {
    var b = document.querySelector(a.sel);
    if (b) coins(b, 9);
    var pts = document.querySelector('[data-pts="' + a.id + '"]');
    if (pts) pts.classList.add('pop');
  } else if (a.type === 'shake') {
    var row = document.querySelector('[data-row="' + a.id + '"]');
    if (row) row.classList.add('shake');
  }
}
function coins(el, n) {
  var r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  for (var i = 0; i < n; i++) {
    var c = document.createElement('span');
    c.className = 'coin'; c.textContent = '🪙';
    c.style.left = cx - 11 + 'px'; c.style.top = cy - 11 + 'px';
    document.body.appendChild(c);
    var ang = -Math.PI / 2 + (Math.random() - .5) * 2.2, d = 50 + Math.random() * 60;
    var an = c.animate([
      { transform: 'translate(0,0) scale(.4)', opacity: 1 },
      { transform: 'translate(' + Math.cos(ang) * d + 'px,' + Math.sin(ang) * d + 'px) scale(1) rotate(' + (Math.random() * 360) + 'deg)', opacity: 1, offset: .55 },
      { transform: 'translate(' + Math.cos(ang) * d * 1.2 + 'px,' + (Math.sin(ang) * d + 60) + 'px) scale(.8)', opacity: 0 }
    ], { duration: 750 + Math.random() * 250, easing: 'cubic-bezier(.2,.7,.4,1)' });
    an.onfinish = c.remove.bind(c);
  }
}
function rain(n) {
  var items = ['🪙', '🪙', '🪙', '💎', '👑', '☠️'];
  for (var i = 0; i < n; i++) {
    var c = document.createElement('span');
    c.className = 'coin'; c.textContent = items[i % items.length];
    c.style.left = Math.random() * 100 + 'vw'; c.style.top = '-40px';
    document.body.appendChild(c);
    var an = c.animate([
      { transform: 'translateY(0) rotate(0)', opacity: 1 },
      { transform: 'translateY(' + (innerHeight + 80) + 'px) rotate(' + (Math.random() * 720 - 360) + 'deg)', opacity: .9 }
    ], { duration: 1800 + Math.random() * 1600, delay: Math.random() * 1200, easing: 'cubic-bezier(.4,0,.8,.6)', fill: 'backwards' });
    an.onfinish = c.remove.bind(c);
  }
}

/* ---------- Actions ---------- */
function addPlayer(name) {
  name = (name || '').trim().slice(0, 14);
  if (!name || S.players.length >= 8) return false;
  if (S.players.some(function (p) { return p.name.toLowerCase() === name.toLowerCase(); })) return false;
  var usedC = S.players.map(function (p) { return p.color; }), usedE = S.players.map(function (p) { return p.emoji; });
  undoStack.push(JSON.stringify(S));
  S.players.push({
    id: 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
    name: name,
    color: COLORS.find(function (c) { return usedC.indexOf(c) < 0; }) || COLORS[0],
    emoji: EMOJIS.find(function (e) { return usedE.indexOf(e) < 0; }) || EMOJIS[0]
  });
  save();
  return true;
}
// L'écran équipage est mis à jour sans toucher au champ pour garder le clavier ouvert.
function refreshSetup() {
  document.getElementById('plist').innerHTML = setupList();
  document.getElementById('recent').innerHTML = recentHtml();
  var f = document.querySelector('[data-form="add"]');
  if (f) f.hidden = S.players.length >= 8;
  var b = document.querySelector('[data-act="start"]');
  if (b) b.disabled = S.players.length < 2;
  var last = document.querySelector('#plist .pl:last-child');
  if (last) last.classList.add('pop');
}
function nextBidder(r, fromId) {
  var ps = S.players, start = ps.findIndex(function (p) { return p.id === fromId; });
  for (var k = 1; k <= ps.length; k++) {
    var p = ps[(start + k) % ps.length];
    if (r.bids[p.id] == null) return p.id;
  }
  return null;
}
function newGame(view) {
  S.rounds = []; S.done = 0; S.edit = null; S.view = view; ui.sel = null; ui.modal = null;
}

var actions = {
  undo: undo,
  settings: function () { ui.modal = { type: 'settings' }; render(); },
  board: function () { ui.modal = { type: 'board' }; render(); },
  rules: function () { ui.modal = { type: 'rules' }; render(); },
  close: function () { ui.modal = null; render(); },
  veil: function (d, ev) { if (ev.target.classList.contains('veil')) { ui.modal = null; render(); } },
  opt: function (d) { commit(function () { S.opts[d.k] = !S.opts[d.k]; }); },
  abandon: function () {
    if (!confirm('Abandonner la partie en cours ?')) return;
    commit(function () { newGame('setup'); });
  },
  recent: function (d) { if (addPlayer(d.name)) { refreshSetup(); buzz(); } },
  del: function (d) { commit(function () { S.players = S.players.filter(function (p) { return p.id !== d.id; }); }); },
  up: function (d) {
    commit(function () {
      var i = S.players.findIndex(function (p) { return p.id === d.id; });
      if (i > 0) S.players.splice(i - 1, 0, S.players.splice(i, 1)[0]);
    });
  },
  emoji: function (d) {
    commit(function () {
      var p = player(d.id), used = S.players.map(function (x) { return x.emoji; });
      var i = EMOJIS.indexOf(p.emoji);
      for (var k = 1; k <= EMOJIS.length; k++) {
        var e = EMOJIS[(i + k) % EMOJIS.length];
        if (used.indexOf(e) < 0) { p.emoji = e; break; }
      }
    });
  },
  start: function () {
    if (S.players.length < 2) return;
    saveRecent();
    commit(function () { newGame('bid'); });
    wake();
  },
  bid: function (d) {
    var r = R(curRound()), id = ui.sel, v = +d.v;
    commit(function () { r.bids[id] = v; ui.sel = nextBidder(r, id); ui.anim = { type: 'pop', sel: '[data-pop="' + id + '"]' }; });
    buzz();
  },
  selbid: function (d) { ui.sel = d.id; render(); },
  cannon: function (d) { var r = R(curRound()); commit(function () { r.cannon[d.id] = !r.cannon[d.id]; }); buzz(); },
  toplay: function () { commit(function () { S.view = 'play'; }); },
  settricks: function (d) {
    var r = R(curRound()), v = +d.v, bid = r.bids[d.id];
    commit(function () {
      r.tricks[d.id] = v;
      ui.anim = v === bid
        ? { type: 'coins', sel: '[data-act="settricks"][data-id="' + d.id + '"][data-v="' + v + '"]', id: d.id }
        : { type: 'shake', id: d.id };
    });
    buzz(v === bid ? 12 : [20, 40, 20]);
  },
  bonus: function (d) { ui.modal = { type: 'bonus', id: d.id }; render(); },
  bset: function (d) {
    var r = R(curRound());
    commit(function () { var b = r.bonus[d.id] || (r.bonus[d.id] = {}); b[d.k] = +d.v; });
    buzz();
  },
  editbid: function (d) { ui.modal = { type: 'pick', id: d.id }; render(); },
  pickbid: function (d) {
    var r = R(curRound());
    commit(function () { r.bids[d.id] = +d.v; ui.modal = null; });
  },
  validate: function () {
    var r = R(curRound()), n = curRound() + 1;
    if (!S.players.every(function (p) { return r.tricks[p.id] != null; })) return;
    var tsum = S.players.reduce(function (t, p) { return t + (r.tricks[p.id] || 0); }, 0);
    if (tsum > n) return;
    commit(function () {
      if (S.edit) { S.view = S.edit.back; S.edit = null; return; }
      S.done++;
      S.view = S.done >= ROUNDS ? 'end' : 'scores';
      ui.anim = S.view === 'end' ? 'end' : 'scores';
    });
    buzz(25);
  },
  next: function () { commit(function () { S.view = 'bid'; ui.sel = null; }); },
  editround: function (d) {
    commit(function () { S.edit = { round: +d.v, back: S.edit ? S.edit.back : S.view }; S.view = 'play'; ui.modal = null; });
  },
  rematch: function () {
    commit(function () { S.players.push(S.players.shift()); newGame('bid'); });
  },
  newcrew: function () { commit(function () { newGame('setup'); }); }
};

document.addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-act]');
  if (!el) return;
  var fn = actions[el.dataset.act];
  if (fn) fn(el.dataset, ev);
});
document.addEventListener('submit', function (ev) {
  ev.preventDefault();
  var inp = document.getElementById('pname');
  if (addPlayer(inp.value)) { inp.value = ''; refreshSetup(); buzz(); }
  else if (inp.value.trim()) { inp.parentNode.classList.remove('shake'); void inp.offsetWidth; inp.parentNode.classList.add('shake'); }
  inp.focus();
});

/* ---------- Écran toujours allumé pendant la partie ---------- */
var lock = null;
function wake() {
  if (S.view === 'setup' || !('wakeLock' in navigator) || lock) return;
  navigator.wakeLock.request('screen').then(function (l) {
    lock = l; l.addEventListener('release', function () { lock = null; });
  }).catch(function () {});
}
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') wake(); });
document.addEventListener('pointerdown', wake, { once: true });

render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});

/* Petite animation de démarrage : logo, titre, quelques pièces qui flottent, puis disparaît.
   Elle démarre tout de suite (jamais de temps mort avant de voir quoi que ce soit) et reste
   affichée au moins le temps de se jouer en entier, même si la page met plus longtemps à
   charger — c'est seulement la disparition qui attend que tout soit prêt, dans la limite
   d'un plafond de sécurité pour ne jamais rester bloquée dessus. */
(function boot() {
  var el = document.getElementById('boot');
  if (!el) return;
  var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (!reduced) {
    var fx = el.querySelector('.bootfx'), items = ['🪙', '🪙', '💀', '⚓', '🏴‍☠️'];
    for (var i = 0; i < 7; i++) {
      var s = document.createElement('span');
      s.textContent = items[i % items.length];
      s.style.left = (8 + Math.random() * 84) + '%';
      s.style.animationDelay = (Math.random() * .7) + 's';
      fx.appendChild(s);
    }
  }
  requestAnimationFrame(function () { el.classList.add('go'); });

  var done = false;
  function dismiss() {
    if (done || !el.parentNode) return;
    done = true;
    el.classList.add('out');
    el.addEventListener('transitionend', function () { el.remove(); }, { once: true });
    setTimeout(function () { if (el.parentNode) el.remove(); }, 500);
  }
  el.addEventListener('click', dismiss);

  var minDisplay = new Promise(function (res) { setTimeout(res, reduced ? 450 : 1450); });
  var pageReady = new Promise(function (res) {
    if (document.readyState === 'complete') res();
    else window.addEventListener('load', res, { once: true });
  });
  var fontsReady = (document.fonts && document.fonts.ready) || Promise.resolve();
  var safetyNet = new Promise(function (res) { setTimeout(res, 3000); });
  Promise.race([Promise.all([minDisplay, pageReady, fontsReady]), safetyNet]).then(dismiss);
})();
</script>
